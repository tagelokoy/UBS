<!doctype html><html><head><meta charset="utf-8"><title>Contact shadow</title>
<style>

#sh{width:1024px;height:384px;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,.28) 45%,rgba(0,0,0,0) 100%)}
</style></head><body><div id="sh"></div></body></html>
